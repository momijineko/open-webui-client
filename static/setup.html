<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenWebUI 安装向导</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .setup-container {
            max-width: 600px;
            width: 100%;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: white;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.1rem;
            text-align: center;
            margin-bottom: 2rem;
        }

        .mode-selection {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .mode-card {
            background: white;
            border-radius: 1rem;
            padding: 2rem;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            text-align: left;
        }

        .mode-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .mode-card .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .mode-card h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 0.5rem;
        }

        .mode-card p {
            color: #6b7280;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .mode-card ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .mode-card li {
            color: #4b5563;
            font-size: 0.85rem;
            padding-left: 1.5rem;
            position: relative;
            margin-bottom: 0.5rem;
        }

        .mode-card li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: #10b981;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="setup-container">
        <h1>欢迎使用 OpenWebUI</h1>
        <p class="subtitle">选择您想如何使用 OpenWebUI</p>

        <div class="mode-selection">
            <div class="mode-card" onclick="selectMode('local')">
                <div class="icon">🖥️</div>
                <h2>本地模式</h2>
                <p>在本地下载并运行 OpenWebUI</p>
                <ul>
                    <li>完全隐私 - 所有数据保留在您的设备上</li>
                    <li>初始下载后无需互联网连接</li>
                    <li>完整访问所有功能包括本地模型</li>
                    <li>需要约 500MB 下载</li>
                </ul>
            </div>

            <div class="mode-card" onclick="selectMode('remote')">
                <div class="icon">☁️</div>
                <h2>远程模式</h2>
                <p>连接到现有的 OpenWebUI 服务器</p>
                <ul>
                    <li>无需下载</li>
                    <li>连接到您自己的服务器或公共实例</li>
                    <li>跨设备共享对话</li>
                    <li>需要网络连接</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        function selectMode(mode) {
            if (mode === 'local') {
                alert('本地模式功能开发中...\n\n请先配置好后端服务，然后访问主页面。');
            } else {
                // 跳转到主页
                window.location.href = '/';
            }
        }
    </script>
</body>
</html>
